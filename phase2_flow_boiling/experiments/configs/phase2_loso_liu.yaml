# Phase 2 v11 — High-Pressure Data Augmentation (Wang et al. 2024)
# Change vs v10 (data only; pressure feature + one-sided Hsu coupling retained):
#   + wang2024 (7 rows): 60×2mm rect channel (w/e=30, D_h=3.871mm), water,
#     P=10/13/16 MPa, G=500-1500, q=100-300 kW/m², ΔT_onb=1.5-3.5K.
#     ONB from boiling curves (SP→PB transition, Fig 7a/b/c). Inlet subcooling
#     ~40K (kuang2025 convention). Wang+Bi, Ann.Nucl.Energy 208:110793.
#
# Rationale (Pattern C residual, high-P extrapolation):
#   v10 added pressure as a feature (corr sign corrected) but P=4.5-5.0 MPa had
#   only 1 training point each (kuang2025 sole high-P source) → extrapolation.
#   Wang2024 extends pressure coverage 5→16 MPa with a clean P↓ sweep
#   (10→3.5K, 13→2.3K, 16→1.5K at G=1000,q=200), giving high-P training anchors.
# Dataset: 344 → 351 rows. train=240  val=51  test=58 (wang2024: 4/1/2).
#
# Run:
#   python experiments/src/train.py --config experiments/configs/phase2_v11_highP_wang.yaml

experiment:
  name: "phase2_loso_liu"
  phase: 2
  scope: "M4_highP_wang"
  seed: 42

data:
  csv_path: "data/raw/onb_dataset_phase2_raw.csv"
  holdout_paper: "liu2005"
  train_frac: 0.70
  val_frac: 0.15
  test_frac: 0.15
  batch_size: 32
  exclude_onb_not_found: true

model:
  surface_latent_dim: 16
  flow_latent_dim: 8
  hidden_dim: 96
  n_layers: 6
  head_hidden: 48
  flow_encoder_hidden: 32
  flow_encoder_dropout: 0.1
  freeze_surface_encoder: true

transfer:
  phase1_checkpoint: "~/PINN-ONB01/phase1_pool_boiling/03_model/checkpoints/baseline_phaseE/phase3_best.pt"

loss:
  w_data_q:       1.0
  w_data_dT:      3.0
  w_hsu_coupling: 0.05
  w_hsu:          0.5
  w_mono_Re:      0.1
  w_mono_G:       0.1
  w_mono_sub:     0.1
  w_continuity:   0.0
  w_momentum:     0.0
  w_energy:       0.0

training:
  stage1:
    epochs: 2000
    optimizer: "adam"
    lr: 1.0e-3
    lr_scheduler: "cosine"
    lr_min: 1.0e-5
    grad_clip: 1.0

  stage2:
    epochs: 3000
    optimizer: "adam"
    lr: 3.0e-4
    lr_scheduler: "cosine"
    lr_min: 1.0e-6
    grad_clip: 1.0

  stage3:
    optimizer: "lbfgs"
    max_iter: 500
    tolerance_grad: 1.0e-7
    tolerance_change: 1.0e-9
    history_size: 50

logging:
  mlflow_tracking_uri: "experiments/logs/mlruns"
  log_every_n_epochs: 50
  save_best: true
  checkpoint_dir: "experiments/checkpoints"

hsu_constraint:
  C_hsu: 0.5
  coupling_one_sided: true   # v9: Hsu saturated superheat as lower bound (hinge)
  r_c_min_um: 1.0
  r_c_max_um: 100.0

collocation:
  n_hsu_points: 500
  n_mono_points: 200
