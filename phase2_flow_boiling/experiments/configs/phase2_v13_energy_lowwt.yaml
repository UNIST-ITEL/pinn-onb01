# Phase 2 v13 — M7-M9 retry: w_energy reduced 0.05→0.002 (v12 failed)
#   v12 (w_energy=0.05) FAILED: 2nd-order energy-residual gradient hijacked the
#   grad-clip(1.0) budget → data loss stuck (Stage1 26→22), test R²_dT=-0.06.
#   v13 cuts w_energy 25× so the energy gradient no longer dominates, keeping
#   the one-sided Hsu coupling + P-trend monotonicity (trend hardening).
# ---- (original v12 header) ----
# Phase 2 v12 — M7-M9: 1D Energy Residual + Trend Hardening + (restored) one-sided Hsu
# Builds on v11 (351 rows, pressure feature). Adds the physics layer and
# CONSOLIDATES the one-sided Hsu coupling that was silently inactive in v10/v11
# (OneDrive reverted the v9 code after commit 76b7373; restored in 156a39b).
#
# Changes vs v11:
#   loss.w_energy   = 0.05  → 1D advection-dominated energy residual on T_star
#       (high-Pe limit: dT*/dx*>0 monotone heating, d²T*/dx*²≈0 near-linear).
#       Full Navier-Stokes (continuity/momentum) NOT implemented — the model is
#       a scalar-ONB regressor with no velocity/pressure fields.
#   loss.w_mono_P   = 0.1   → P↑→ΔT_onb↓ soft monotonicity (trend #4), uses the
#       reduced-pressure feature (channel 9) added in v10.
#   hsu_constraint.coupling_one_sided = true  → now ACTUALLY active (restored).
#   collocation.n_energy_points = 64.
#
# Goal (M7-M9 Go/No-Go): all testable physical trends monotone
#   (q↑→ΔT↑, P↑→ΔT↓, ΔT_sub↑→ΔT↑, Re↑/G↑→ΔT↓) + smooth physical T field.
# Dataset: 351 rows (=v11). train=240  val=51  test=58.
#
# Run:
#   python experiments/src/train.py --config experiments/configs/phase2_v13_energy_lowwt.yaml

experiment:
  name: "phase2_v13_energy_lowwt"
  phase: 2
  scope: "M7_energy_lowwt"
  seed: 42

data:
  csv_path: "data/raw/onb_dataset_phase2_raw.csv"
  train_frac: 0.70
  val_frac: 0.15
  test_frac: 0.15
  batch_size: 32
  exclude_onb_not_found: true

model:
  surface_latent_dim: 16
  flow_latent_dim: 8
  hidden_dim: 96
  n_layers: 6
  head_hidden: 48
  flow_encoder_hidden: 32
  flow_encoder_dropout: 0.1
  freeze_surface_encoder: true

transfer:
  phase1_checkpoint: "~/PINN-ONB01/phase1_pool_boiling/03_model/checkpoints/baseline_phaseE/phase3_best.pt"

loss:
  w_data_q:       1.0
  w_data_dT:      3.0
  w_hsu_coupling: 0.05
  w_hsu:          0.5
  w_mono_Re:      0.1
  w_mono_G:       0.1
  w_mono_sub:     0.1
  w_mono_P:       0.1     # v12: P↑→ΔT_onb↓ (trend #4) soft monotonicity
  w_continuity:   0.0     # not implemented (no velocity/pressure fields)
  w_momentum:     0.0     # not implemented
  w_energy:       0.002   # v12: 1D advection-dominated energy residual on T_star

training:
  stage1:
    epochs: 2000
    optimizer: "adam"
    lr: 1.0e-3
    lr_scheduler: "cosine"
    lr_min: 1.0e-5
    grad_clip: 1.0

  stage2:
    epochs: 3000
    optimizer: "adam"
    lr: 3.0e-4
    lr_scheduler: "cosine"
    lr_min: 1.0e-6
    grad_clip: 1.0

  stage3:
    optimizer: "lbfgs"
    max_iter: 500
    tolerance_grad: 1.0e-7
    tolerance_change: 1.0e-9
    history_size: 50

logging:
  mlflow_tracking_uri: "experiments/logs/mlruns"
  log_every_n_epochs: 50
  save_best: true
  checkpoint_dir: "experiments/checkpoints"

hsu_constraint:
  C_hsu: 0.5
  coupling_one_sided: true   # v9: Hsu saturated superheat as lower bound (hinge)
  r_c_min_um: 1.0
  r_c_max_um: 100.0

collocation:
  n_hsu_points: 500
  n_mono_points: 200
  n_energy_points: 64    # x_star ∈ (0,1) collocation for 1D energy residual
