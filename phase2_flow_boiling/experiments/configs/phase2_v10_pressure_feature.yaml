# Phase 2 v10 — Reduced Pressure as Direct Flow Feature
# Change vs v9 (code-level, FLOW_NUMERIC_CHANNELS 9→11; everything else identical):
#   flow_encoder: + ch9 log10(P_r=P/P_crit), + ch10 P_mask (missing P → atm, mask=0)
#   Retains v9 one-sided Hsu coupling.
#
# Rationale (Pattern C diagnosis, high-pressure region):
#   Pressure was NOT an encoder input — entered only indirectly via properties.
#   v9 had corr(P, pred ΔT)=+0.010 vs corr(P, true ΔT)=−0.137: the model was
#   blind to pressure and overpredicted high-P low-ΔT (kuang2025 P=2500-5000 kPa:
#   true 2.9-4.9K, pred ~5-6K). It also violated physical trend #4 (P↑→ΔT_ONB↓).
#   Adding reduced pressure as a direct feature gives an explicit pressure knob.
#   NOTE: 44% of rows (liu2005, forrest2016) have P unknown → atmospheric imputed
#   with P_mask=0 so the network can distinguish measured vs imputed pressure.
# Dataset: 344 rows (same as v8/v9). train=236  val=50  test=56.
#
# Run:
#   python experiments/src/train.py --config experiments/configs/phase2_v10_pressure_feature.yaml

experiment:
  name: "phase2_v10_pressure_feature"
  phase: 2
  scope: "M4_pressure_feature"
  seed: 42

data:
  csv_path: "data/raw/onb_dataset_phase2_raw.csv"
  train_frac: 0.70
  val_frac: 0.15
  test_frac: 0.15
  batch_size: 32
  exclude_onb_not_found: true

model:
  surface_latent_dim: 16
  flow_latent_dim: 8
  hidden_dim: 96
  n_layers: 6
  head_hidden: 48
  flow_encoder_hidden: 32
  flow_encoder_dropout: 0.1
  freeze_surface_encoder: true

transfer:
  phase1_checkpoint: "~/PINN-ONB01/phase1_pool_boiling/03_model/checkpoints/baseline_phaseE/phase3_best.pt"

loss:
  w_data_q:       1.0
  w_data_dT:      3.0
  w_hsu_coupling: 0.05
  w_hsu:          0.5
  w_mono_Re:      0.1
  w_mono_G:       0.1
  w_mono_sub:     0.1
  w_continuity:   0.0
  w_momentum:     0.0
  w_energy:       0.0

training:
  stage1:
    epochs: 2000
    optimizer: "adam"
    lr: 1.0e-3
    lr_scheduler: "cosine"
    lr_min: 1.0e-5
    grad_clip: 1.0

  stage2:
    epochs: 3000
    optimizer: "adam"
    lr: 3.0e-4
    lr_scheduler: "cosine"
    lr_min: 1.0e-6
    grad_clip: 1.0

  stage3:
    optimizer: "lbfgs"
    max_iter: 500
    tolerance_grad: 1.0e-7
    tolerance_change: 1.0e-9
    history_size: 50

logging:
  mlflow_tracking_uri: "experiments/logs/mlruns"
  log_every_n_epochs: 50
  save_best: true
  checkpoint_dir: "experiments/checkpoints"

hsu_constraint:
  C_hsu: 0.5
  coupling_one_sided: true   # v9: Hsu saturated superheat as lower bound (hinge)
  r_c_min_um: 1.0
  r_c_max_um: 100.0

collocation:
  n_hsu_points: 500
  n_mono_points: 200
