[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pinn_onb"
version = "0.1.0-dev"
description = "Physics-Informed Neural Network for pool/flow boiling ONB prediction (PINN-BOILING workspace)"
readme = "../README.md"
requires-python = ">=3.10,<3.14"
license = {text = "MIT"}
authors = [
    {name = "Jaeseon Lee", email = "JaeseonLee@unist.ac.kr"},
    {name = "Gyuchang Kim"},
    {name = "Eunjeong Ko"},
    {name = "Yujin Kim"},
]
keywords = [
    "physics-informed neural network",
    "pool boiling",
    "onset of nucleate boiling",
    "ONB",
    "surface engineering",
    "Hsu nucleation",
    "heat transfer",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.26,<3.0",
    "pandas>=2.1,<3.0",
    "scipy>=1.11,<2.0",
    "scikit-learn>=1.4,<2.0",
    "PyYAML>=6.0,<7.0",
    "CoolProp>=6.6,<8.0",
    "torch>=2.1,<3.0",
    "mlflow>=2.10,<4.0",
    "optuna>=3.5,<5.0",
    "matplotlib>=3.8,<4.0",
    "plotly>=5.18,<7.0",
    "pdfplumber>=0.11,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9.0",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/UNIST-ITEL/pinn-onb01"
Repository = "https://github.com/UNIST-ITEL/pinn-onb01"
Issues = "https://github.com/UNIST-ITEL/pinn-onb01/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pinn_onb*"]

[tool.setuptools.package-data]
pinn_onb = ["py.typed"]
