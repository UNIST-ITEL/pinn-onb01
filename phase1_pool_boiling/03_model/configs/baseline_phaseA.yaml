run_name: baseline_phaseA
seed: 42
device: cpu   # change to cuda if GPU is available

data:
  csv_path: 02_data/processed/onb_dataset.csv
  skip_unsupported_fluids: true   # drop FC-77 rows (CoolProp unsupported)
  train_val_test_split: [0.8, 0.1, 0.1]
  batch_size: 16

model:
  conditioning: concat   # "concat" (default 30k params) or "film" (40k params)
  surface_encoder:
    latent_dim: 16       # must match pinn.latent_dim
  pinn:
    hidden_dim: 64
    n_layers: 5

domain:
  L_plate_m: 1.0e-3      # heater thickness [m] (1 mm Cu plate)
  fluid_default: water   # used for nondimensionalising collocation domain
  P_default: 101325.0    # [Pa] atmospheric pressure

collocation:
  n_points: 2000         # LHS collocation points per resample
  resample_every: 100    # re-draw every N epochs

loss_weights:
  w_pde:  1.0
  w_bc:   1.0
  w_data: 10.0   # high weight — only 48 data points
  w_onb:  5.0    # Hsu ONB soft constraint

training:
  phase1:
    epochs: 500
    lr: 1.0e-3
    optimizer: adam
    early_stop_patience: 200

  phase2:
    # Skeleton — synthetic data not yet available
    epochs: 0
    lr: 1.0e-3
    optimizer: adam
    data_source: synthetic   # 02_data/raw/synthetic/ (future)

  phase3:
    adam_epochs: 2000
    lbfgs_epochs: 1000
    lr_adam: 5.0e-4
    early_stop_patience: 200
    freeze_heads_for_lbfgs: true   # backbone-only L-BFGS (recommended)
    data_source: experiment         # 02_data/processed/onb_dataset.csv

  phase4:
    epochs: 3000
    lr: 1.0e-3
    inverse_mode: true      # REQUIRED — activates r_c as learnable parameter
    optimize: ["r_c"]
    data_source: experiment

logging:
  mlflow_uri: 03_model/experiments
  checkpoint_dir: 03_model/checkpoints
  log_every: 50   # print + mlflow log every N epochs
